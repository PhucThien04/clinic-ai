services:
  db:
    image: postgres:15
    container_name: db
    ports:
      - "5432:5432"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-clinic_duc_tin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-clinic_duc_tin}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8000:8000"
    env_file:
      - path: ./ai-service/.env
        required: false
    volumes:
      - ./ai-service/app:/app/app

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "5432"
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  postgres_data:
    external: true
    name: 38f4822e157da812e7944c92878531210ee60ca166140bb67c891b8b62a63e67
